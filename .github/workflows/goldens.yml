name: Record Linux visual baselines
on:
  pull_request:
    paths:
      - .github/workflows/goldens.yml
      - packages/asystant_ai/test/gen_ui_golden_test.dart
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Resolve workspace dependencies
        run: flutter pub get
      - name: Record native Linux goldens
        working-directory: packages/asystant_ai
        run: flutter test --update-goldens test/gen_ui_golden_test.dart
      - name: Verify deterministic Linux rendering
        working-directory: packages/asystant_ai
        run: flutter test test/gen_ui_golden_test.dart
      - name: Upload baselines for visual review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-goldens
          path: packages/asystant_ai/test/goldens/linux/*.png
          if-no-files-found: error
          retention-days: 7
