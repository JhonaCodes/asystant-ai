name: Record Linux visual baselines
on:
  pull_request:
    paths:
      - .github/workflows/goldens.yml
      - packages/asystant_ai/test/gen_ui_golden_test.dart
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Resolve workspace dependencies
        run: flutter pub get
      - name: Record native Linux goldens
        working-directory: packages/asystant_ai
        run: flutter test --update-goldens test/gen_ui_golden_test.dart
      - name: Verify deterministic Linux rendering
        working-directory: packages/asystant_ai
        run: flutter test test/gen_ui_golden_test.dart
      - name: Upload baselines for visual review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-goldens
          path: packages/asystant_ai/test/goldens/linux/*.png
          if-no-files-found: error
          retention-days: 7
