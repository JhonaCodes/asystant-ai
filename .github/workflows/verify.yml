name: Verify SDK and gateway
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: asystant_test
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: asystant_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U asystant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ASYSTANT_TEST_DATABASE_URL: postgres://asystant_test:ephemeral_ci_only@127.0.0.1:5432/asystant_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
      - name: Install Rust and PostgreSQL build dependencies
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.95.0
          sudo apt-get update
          sudo apt-get install -y libpq-dev pkg-config cmake
      - name: Analyze and test
        run: sh scripts/check.sh
      - name: Check Rust formatting
        run: cargo fmt --manifest-path services/asystant_gateway/Cargo.toml --check
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit --file services/asystant_gateway/Cargo.lock
      - name: Validate OpenAPI
        run: |
          python3 -m venv /tmp/asystant-openapi
          /tmp/asystant-openapi/bin/pip install openapi-spec-validator==0.7.2
          /tmp/asystant-openapi/bin/python -c "import json; from openapi_spec_validator import validate; validate(json.load(open('services/asystant_gateway/openapi.yaml')))"
      - name: Build and check deployment container
        run: |
          docker build -t asystant-gateway:local services/asystant_gateway
          python3 scripts/check_container.py
