name: host_app
description: Botánica, a local-first botanical medicine app that embeds the asystant_ai assistant.
publish_to: none
version: 0.1.0+1
resolution: workspace
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  reactive_notifier: ^2.18.1
  asystant_ai:
    path: ../../packages/asystant_ai
  result_controller: ^1.3.0
  logger_rs: ^2.1.1
  go_router: ^17.5.0
  flutter_local_db: ^1.5.2
  path_provider: ^2.1.6
  uuid: ^4.6.0
  url_launcher: ^6.3.2
  collection: ^1.19.1
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - assets/seed/plants/
    - assets/plants/
